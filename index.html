<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Ebook Library</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f4ef;
      color: #222;
    }

    header {
      background: #ffffff;
      padding: 20px 30px;
      border-bottom: 1px solid #ddd;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .search {
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 220px;
      outline: none;
    }

    .search:focus {
      border-color: #777;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 30px;
    }

    .hero {
      margin-bottom: 30px;
    }

    .hero h2 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .hero p {
      color: #666;
    }

    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .import-button {
      border: none;
      background: #222;
      color: white;

      padding: 12px 18px;
      border-radius: 8px;

      cursor: pointer;
      font-size: 14px;

      transition: 0.2s;
    }

    .import-button:hover {
      background: #444;
    }

    .import-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .book-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(150px, 1fr));

      gap: 25px;
    }

    .book {
      background: white;
      padding: 12px;
      border-radius: 12px;

      box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.08);

      transition:
        transform 0.2s,
        box-shadow 0.2s;
    }

    .book:hover {
      transform: translateY(-3px);

      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.12);
    }

    .cover {
      background: #ddd;
      height: 220px;
      border-radius: 8px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 50px;
    }

    .book h3 {
      margin: 12px 0 5px;
      font-size: 16px;

      overflow-wrap: anywhere;
    }

    .book p {
      margin: 0;
      color: #777;
      font-size: 13px;
    }

    .empty-library {
      color: #777;
      margin-top: 20px;
    }

    @media (max-width: 600px) {

      header {
        padding: 15px;
        flex-direction: column;
        align-items: stretch;
      }

      header h1 {
        text-align: center;
      }

      .search {
        width: 100%;
      }

      main {
        padding: 20px 15px;
      }

      .hero h2 {
        font-size: 26px;
      }

      .library-header {
        align-items: stretch;
        flex-direction: column;
      }

      .import-button {
        width: 100%;
      }

      .book-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 15px;
      }

      .cover {
        height: 190px;
      }

    }

  </style>
</head>


<body>

  <header>

    <h1>📚 My Library</h1>

    <input
      class="search"
      id="searchInput"
      type="search"
      placeholder="Search books..."
    >

  </header>


  <main>

    <section class="hero">

      <h2>Your personal ebook library.</h2>

      <p>
        Read and organize your EPUB books in one place.
      </p>

    </section>


    <section>

      <div class="library-header">

        <h2>My Books</h2>

        <button
          class="import-button"
          id="importButton"
          disabled
        >
          + Import EPUB
        </button>

        <input
          type="file"
          id="epubInput"
          accept=".epub,application/epub+zip"
          hidden
        >

      </div>


      <div
        class="book-grid"
        id="bookGrid"
      ></div>


      <p
        class="empty-library"
        id="emptyLibrary"
      >
        Your library is empty. Import an EPUB to begin.
      </p>

    </section>

  </main>


  <script>

    const importButton =
      document.getElementById("importButton");

    const epubInput =
      document.getElementById("epubInput");

    const bookGrid =
      document.getElementById("bookGrid");

    const emptyLibrary =
      document.getElementById("emptyLibrary");

    const searchInput =
      document.getElementById("searchInput");


    let db;

    let allBooks = [];


    // =============================
    // OPEN INDEXEDDB DATABASE
    // =============================

    const databaseRequest =
      indexedDB.open("ebookLibrary", 1);


    databaseRequest.onupgradeneeded =
      function(event) {

        db = event.target.result;


        if (
          !db.objectStoreNames.contains("books")
        ) {

          db.createObjectStore(
            "books",
            {
              keyPath: "id",
              autoIncrement: true
            }
          );

        }

      };


    databaseRequest.onsuccess =
      function(event) {

        db = event.target.result;

        importButton.disabled = false;

        loadBooks();

      };


    databaseRequest.onerror =
      function(event) {

        console.error(
          "Database error:",
          event.target.error
        );

        alert(
          "Could not open the ebook database."
        );

      };


    // =============================
    // IMPORT BUTTON
    // =============================

    importButton.addEventListener(
      "click",
      function() {

        if (!db) {

          alert(
            "The library is still loading. Please wait a moment."
          );

          return;

        }

        epubInput.click();

      }
    );


    // =============================
    // EPUB SELECTED
    // =============================

    epubInput.addEventListener(
      "change",
      function(event) {

        const file =
          event.target.files[0];


        if (!file) {
          return;
        }


        if (
          !file.name
            .toLowerCase()
            .endsWith(".epub")
        ) {

          alert(
            "Please choose an EPUB file."
          );

          epubInput.value = "";

          return;

        }


        saveBook(file);

      }
    );


    // =============================
    // SAVE EPUB
    // =============================

    function saveBook(file) {

      if (!db) {

        alert(
          "The library database is not ready."
        );

        return;

      }


      const transaction =
        db.transaction(
          ["books"],
          "readwrite"
        );


      const store =
        transaction.objectStore("books");


      const book = {

        title:
          file.name.replace(
            /\.epub$/i,
            ""
          ),

        filename:
          file.name,

        file:
          file,

        added:
          new Date().toISOString()

      };


      const addRequest =
        store.add(book);


      addRequest.onsuccess =
        function() {

          epubInput.value = "";

          loadBooks();

        };


      addRequest.onerror =
        function(event) {

          console.error(
            "Save error:",
            event.target.error
          );

          alert(
            "Could not save this book."
          );

        };

    }


    // =============================
    // LOAD BOOKS
    // =============================

    function loadBooks() {

      const transaction =
        db.transaction(
          ["books"],
          "readonly"
        );


      const store =
        transaction.objectStore("books");


      const getRequest =
        store.getAll();


      getRequest.onsuccess =
        function() {

          allBooks =
            getRequest.result || [];


          allBooks.sort(
            function(a, b) {

              return new Date(b.added) -
                     new Date(a.added);

            }
          );


          displayBooks(allBooks);

        };


      getRequest.onerror =
        function(event) {

          console.error(
            "Load error:",
            event.target.error
          );

          alert(
            "Could not load your books."
          );

        };

    }


    // =============================
    // DISPLAY BOOKS
    // =============================

    function displayBooks(books) {

      bookGrid.innerHTML = "";


      if (books.length === 0) {

        emptyLibrary.style.display =
          "block";

        return;

      }


      emptyLibrary.style.display =
        "none";


      books.forEach(
        function(book) {

          const bookElement =
            document.createElement("div");


          bookElement.className =
            "book";


          bookElement.innerHTML = `

            <div class="cover">
              📖
            </div>

            <h3>
              ${escapeHTML(book.title)}
            </h3>

            <p>
              EPUB Book
            </p>

          `;


          bookGrid.appendChild(
            bookElement
          );

        }
      );

    }


    // =============================
    // SEARCH BOOKS
    // =============================

    searchInput.addEventListener(
      "input",
      function() {

        const searchTerm =
          searchInput.value
            .trim()
            .toLowerCase();


        if (!searchTerm) {

          displayBooks(allBooks);

          return;

        }


        const filteredBooks =
          allBooks.filter(
            function(book) {

              return book.title
                .toLowerCase()
                .includes(searchTerm);

            }
          );


        displayBooks(filteredBooks);

      }
    );


    // =============================
    // SECURITY
    // =============================

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }

  </script>

</body>

</html>
