<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Ebook Library</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f4ef;
      color: #222;
    }

    header {
      background: white;
      padding: 20px 30px;
      border-bottom: 1px solid #ddd;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .search {
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 220px;
      outline: none;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 30px;
    }

    .hero {
      margin-bottom: 30px;
    }

    .hero h2 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .hero p {
      color: #666;
    }

    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .import-button {
      border: none;
      background: #222;
      color: white;

      padding: 12px 18px;
      border-radius: 8px;

      cursor: pointer;
      font-size: 14px;
    }

    .import-button:hover {
      background: #444;
    }

    .book-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(150px, 1fr));

      gap: 25px;
    }

    .book {
      background: white;
      padding: 12px;
      border-radius: 12px;

      cursor: pointer;

      box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.08);

      transition:
        transform 0.2s,
        box-shadow 0.2s;
    }

    .book:hover {
      transform: translateY(-4px);

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.13);
    }

    .cover {
      background: #ddd;
      height: 220px;
      border-radius: 8px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 50px;
    }

    .book h3 {
      margin: 12px 0 5px;
      font-size: 16px;

      overflow-wrap: anywhere;
    }

    .book p {
      margin: 0;
      color: #777;
      font-size: 13px;
    }

    .empty-library {
      color: #777;
    }


    /* ============================
       EPUB READER
    ============================ */

    #readerScreen {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: #f8f7f2;

      z-index: 9999;

      display: none;
      flex-direction: column;
    }

    .reader-header {
      height: 60px;

      background: white;

      border-bottom: 1px solid #ddd;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;

      gap: 15px;
    }

    .reader-title {
      font-weight: bold;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      flex: 1;

      text-align: center;
    }

    .reader-button {
      border: none;

      background: #222;
      color: white;

      padding: 9px 14px;

      border-radius: 7px;

      cursor: pointer;
    }

    .reader-button:hover {
      background: #444;
    }

    #viewer {
      flex: 1;

      width: 100%;

      overflow: hidden;
    }

    .reader-controls {
      height: 65px;

      background: white;

      border-top: 1px solid #ddd;

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 20px;

      padding: 10px;
    }

    .navigation-button {
      border: none;

      background: #222;
      color: white;

      padding: 11px 25px;

      border-radius: 8px;

      cursor: pointer;
    }

    .navigation-button:hover {
      background: #444;
    }


    /* ============================
       MOBILE
    ============================ */

    @media (max-width: 600px) {

      header {
        padding: 15px;

        flex-direction: column;

        align-items: stretch;
      }

      header h1 {
        text-align: center;
      }

      .search {
        width: 100%;
      }

      main {
        padding: 20px 15px;
      }

      .hero h2 {
        font-size: 26px;
      }

      .library-header {
        flex-direction: column;

        align-items: stretch;
      }

      .import-button {
        width: 100%;
      }

      .book-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 15px;
      }

      .cover {
        height: 190px;
      }

      .reader-header {
        padding: 0 10px;
      }

      .reader-title {
        font-size: 14px;
      }

      .navigation-button {
        padding: 10px 20px;
      }

    }

  </style>
</head>


<body>


  <!-- ============================
       LIBRARY
  ============================ -->

  <header>

    <h1>📚 My Library</h1>

    <input
      class="search"
      id="searchInput"
      type="search"
      placeholder="Search books..."
    >

  </header>


  <main>

    <section class="hero">

      <h2>Your personal ebook library.</h2>

      <p>
        Read and organize your EPUB books in one place.
      </p>

    </section>


    <section>

      <div class="library-header">

        <h2>My Books</h2>

        <button
          class="import-button"
          id="importButton"
          disabled
        >
          + Import EPUB
        </button>

        <input
          type="file"
          id="epubInput"
          accept=".epub,application/epub+zip"
          hidden
        >

      </div>


      <div
        class="book-grid"
        id="bookGrid"
      ></div>


      <p
        class="empty-library"
        id="emptyLibrary"
      >
        Your library is empty.
        Import an EPUB to begin.
      </p>

    </section>

  </main>



  <!-- ============================
       READER
  ============================ -->

  <div id="readerScreen">

    <div class="reader-header">

      <button
        class="reader-button"
        id="closeReader"
      >
        ← Library
      </button>


      <div
        class="reader-title"
        id="readerTitle"
      >
        Book
      </div>


      <div style="width: 80px;"></div>

    </div>


    <div id="viewer"></div>


    <div class="reader-controls">

      <button
        class="navigation-button"
        id="previousPage"
      >
        ‹ Previous
      </button>


      <button
        class="navigation-button"
        id="nextPage"
      >
        Next ›
      </button>

    </div>

  </div>



  <!-- EPUB.JS -->

  <script
    src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js">
  </script>


  <script>

    const importButton =
      document.getElementById("importButton");

    const epubInput =
      document.getElementById("epubInput");

    const bookGrid =
      document.getElementById("bookGrid");

    const emptyLibrary =
      document.getElementById("emptyLibrary");

    const searchInput =
      document.getElementById("searchInput");


    const readerScreen =
      document.getElementById("readerScreen");

    const readerTitle =
      document.getElementById("readerTitle");

    const closeReader =
      document.getElementById("closeReader");

    const previousPage =
      document.getElementById("previousPage");

    const nextPage =
      document.getElementById("nextPage");


    let db;

    let allBooks = [];

    let currentEpubBook = null;

    let currentRendition = null;



    // ============================
    // OPEN DATABASE
    // ============================

    const databaseRequest =
      indexedDB.open(
        "ebookLibrary",
        1
      );


    databaseRequest.onupgradeneeded =
      function(event) {

        db =
          event.target.result;


        if (
          !db.objectStoreNames.contains(
            "books"
          )
        ) {

          db.createObjectStore(
            "books",
            {
              keyPath: "id",
              autoIncrement: true
            }
          );

        }

      };


    databaseRequest.onsuccess =
      function(event) {

        db =
          event.target.result;

        importButton.disabled =
          false;

        loadBooks();

      };


    databaseRequest.onerror =
      function() {

        alert(
          "Could not open ebook database."
        );

      };



    // ============================
    // IMPORT EPUB
    // ============================

    importButton.addEventListener(
      "click",
      function() {

        epubInput.click();

      }
    );


    epubInput.addEventListener(
      "change",
      function(event) {

        const file =
          event.target.files[0];


        if (!file) {
          return;
        }


        if (
          !file.name
            .toLowerCase()
            .endsWith(".epub")
        ) {

          alert(
            "Please choose an EPUB file."
          );

          epubInput.value = "";

          return;

        }


        saveBook(file);

      }
    );



    // ============================
    // SAVE BOOK
    // ============================

    function saveBook(file) {

      const transaction =
        db.transaction(
          ["books"],
          "readwrite"
        );


      const store =
        transaction.objectStore(
          "books"
        );


      const book = {

        title:
          file.name.replace(
            /\.epub$/i,
            ""
          ),

        filename:
          file.name,

        file:
          file,

        added:
          new Date().toISOString()

      };


      const request =
        store.add(book);


      request.onsuccess =
        function() {

          epubInput.value = "";

          loadBooks();

        };


      request.onerror =
        function() {

          alert(
            "Could not save this book."
          );

        };

    }



    // ============================
    // LOAD BOOKS
    // ============================

    function loadBooks() {

      const transaction =
        db.transaction(
          ["books"],
          "readonly"
        );


      const store =
        transaction.objectStore(
          "books"
        );


      const request =
        store.getAll();


      request.onsuccess =
        function() {

          allBooks =
            request.result || [];


          allBooks.sort(
            function(a, b) {

              return (
                new Date(b.added) -
                new Date(a.added)
              );

            }
          );


          displayBooks(
            allBooks
          );

        };

    }



    // ============================
    // DISPLAY BOOKS
    // ============================

    function displayBooks(books) {

      bookGrid.innerHTML =
        "";


      if (
        books.length === 0
      ) {

        emptyLibrary.style.display =
          "block";

        return;

      }


      emptyLibrary.style.display =
        "none";


      books.forEach(
        function(book) {

          const bookElement =
            document.createElement(
              "div"
            );


          bookElement.className =
            "book";


          bookElement.innerHTML = `

            <div class="cover">
              📖
            </div>

            <h3>
              ${escapeHTML(book.title)}
            </h3>

            <p>
              Click to read
            </p>

          `;


          // OPEN BOOK WHEN CLICKED

          bookElement.addEventListener(
            "click",
            function() {

              openBook(book);

            }
          );


          bookGrid.appendChild(
            bookElement
          );

        }
      );

    }



    // ============================
    // OPEN EPUB
    // ============================

    async function openBook(book) {

      try {

        readerScreen.style.display =
          "flex";


        readerTitle.textContent =
          book.title;


        document.body.style.overflow =
          "hidden";


        document.getElementById(
          "viewer"
        ).innerHTML = "";


        const arrayBuffer =
          await book.file.arrayBuffer();


        currentEpubBook =
          ePub(arrayBuffer);


        currentRendition =
          currentEpubBook.renderTo(
            "viewer",
            {
              width: "100%",
              height: "100%",

              spread: "auto",

              flow: "paginated"
            }
          );


        currentRendition.themes.default({

          body: {
            "font-family":
              "Georgia, serif",

            "line-height":
              "1.6",

            "padding":
              "0 5%"
          }

        });


        await currentRendition.display();


      }

      catch(error) {

        console.error(
          error
        );


        alert(
          "This EPUB could not be opened."
        );


        closeBookReader();

      }

    }



    // ============================
    // NEXT PAGE
    // ============================

    nextPage.addEventListener(
      "click",
      function() {

        if (
          currentRendition
        ) {

          currentRendition.next();

        }

      }
    );



    // ============================
    // PREVIOUS PAGE
    // ============================

    previousPage.addEventListener(
      "click",
      function() {

        if (
          currentRendition
        ) {

          currentRendition.prev();

        }

      }
    );



    // ============================
    // CLOSE READER
    // ============================

    closeReader.addEventListener(
      "click",
      closeBookReader
    );


    function closeBookReader() {

      readerScreen.style.display =
        "none";


      document.body.style.overflow =
        "";


      if (
        currentRendition
      ) {

        currentRendition.destroy();

        currentRendition =
          null;

      }


      if (
        currentEpubBook
      ) {

        currentEpubBook.destroy();

        currentEpubBook =
          null;

      }


      document.getElementById(
        "viewer"
      ).innerHTML = "";

    }



    // ============================
    // KEYBOARD CONTROLS
    // ============================

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          readerScreen.style.display
          !== "flex"
        ) {

          return;

        }


        if (
          event.key ===
          "ArrowRight"
        ) {

          currentRendition?.next();

        }


        if (
          event.key ===
          "ArrowLeft"
        ) {

          currentRendition?.prev();

        }


        if (
          event.key ===
          "Escape"
        ) {

          closeBookReader();

        }

      }
    );



    // ============================
    // SEARCH
    // ============================

    searchInput.addEventListener(
      "input",
      function() {

        const searchTerm =
          searchInput.value
            .trim()
            .toLowerCase();


        if (!searchTerm) {

          displayBooks(
            allBooks
          );

          return;

        }


        const filteredBooks =
          allBooks.filter(
            function(book) {

              return book.title
                .toLowerCase()
                .includes(
                  searchTerm
                );

            }
          );


        displayBooks(
          filteredBooks
        );

      }
    );



    // ============================
    // SECURITY
    // ============================

    function escapeHTML(text) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        text;

      return div.innerHTML;

    }

  </script>

</body>

</html>
